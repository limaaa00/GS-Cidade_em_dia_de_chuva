<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: cabecalho('Bairros')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<h2>Bairros</h2>
<div th:replace="~{fragments/layout :: mensagens}"></div>
<p><a th:href="@{/bairros/novo}">Novo bairro</a></p>
<table>
    <thead>
    <tr><th>Nome</th><th>Zona</th><th>População</th><th>Ações</th></tr>
    </thead>
    <tbody>
    <tr th:each="b : ${bairros}">
        <td th:text="${b.nome}"></td>
        <td th:text="${b.zona}"></td>
        <td th:text="${b.populacao}"></td>
        <td>
            <a th:href="@{/bairros/{id}/editar(id=${b.id})}">Editar</a>
            <form th:action="@{/bairros/{id}/excluir(id=${b.id})}" method="post" style="display:inline">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
