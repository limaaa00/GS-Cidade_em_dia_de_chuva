<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: cabecalho('Trechos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<h2>Trechos de calçada</h2>
<div th:replace="~{fragments/layout :: mensagens}"></div>
<p><a th:href="@{/trechos/novo}">Novo trecho</a></p>
<table>
    <thead>
    <tr><th>Logradouro</th><th>Bairro</th><th>Tipo</th><th>Altitude</th><th>Ações</th></tr>
    </thead>
    <tbody>
    <tr th:each="t : ${trechos}">
        <td th:text="${t.logradouro}"></td>
        <td th:text="${t.bairroNome}"></td>
        <td th:text="${t.tipoCalcada}"></td>
        <td th:text="${t.altitude}"></td>
        <td>
            <a th:href="@{/trechos/{id}/editar(id=${t.id})}">Editar</a>
            <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post" style="display:inline">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
